# Weekly live eval placeholder (SPEC-02). Suites land with agent eval specs; keys from Actions secrets only.
name: Weekly eval

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: make setup
      - run: make eval
        env:
          OPENAI_API_KEY: ${{ secrets.LIVE_EVAL_OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.LIVE_EVAL_ELEVENLABS_API_KEY }}