# TEST_STRATEGY.md nightly set entry point: T-31 fresh-clone (SPEC-01a), skip when main unchanged (AC6).
name: Nightly

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  DOCKER_BUILDKIT: "1"

jobs:
  skip-if-unchanged:
    runs-on: ubuntu-latest
    outputs:
      run_suite: ${{ steps.main.outputs.run_suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        with:
          path: /tmp/nightly-main-head
          key: nightly-main-${{ github.event_name }}-${{ github.run_id }}
          restore-keys: nightly-main-
      - id: main
        run: |
          git fetch origin main --depth=1
          HEAD_SHA=$(git rev-parse origin/main)
          PREV=""
          if [ -f /tmp/nightly-main-head/sha.txt ]; then PREV=$(cat /tmp/nightly-main-head/sha.txt); fi
          if [ "$HEAD_SHA" = "$PREV" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run_suite=false" >> "$GITHUB_OUTPUT"
            echo "nightly: main unchanged since last run ($HEAD_SHA); skipping suites (SPEC-02 AC6)"
          else
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
            mkdir -p /tmp/nightly-main-head
            echo "$HEAD_SHA" > /tmp/nightly-main-head/sha.txt
          fi
      - if: steps.main.outputs.run_suite == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/nightly-main-head
          key: nightly-main-${{ github.event_name }}-${{ github.run_id }}

  fresh-clone:
    needs: skip-if-unchanged
    if: needs.skip-if-unchanged.outputs.run_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: e2e/nfr/fresh-clone.sh main
        env:
          REPO_URL: file://${{ github.workspace }}