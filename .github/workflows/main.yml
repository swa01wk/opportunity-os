# ADR-022: build every image and smoke /readyz on ephemeral stack after merge to main.
name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  COMPOSE_PROJECT: oos-ci
  DOCKER_BUILDKIT: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: make setup
      - run: make ci-images
      - run: make up
      - name: readyz smoke
        run: |
          compose=(docker compose --project-name oos-ci --env-file infra/images.env --env-file .env)
          py='import os,sys,urllib.request as u; u.urlopen("http://127.0.0.1:"+os.environ["PORT"]+"/readyz"); sys.exit(0)'
          node='fetch(`http://127.0.0.1:${process.env.PORT}/readyz`).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))'
          for service in api worker; do "${compose[@]}" exec -T "$service" python -c "$py"; done
          for service in render web; do "${compose[@]}" exec -T "$service" node -e "$node"; done
      - if: always()
        run: make down CLEAN=1