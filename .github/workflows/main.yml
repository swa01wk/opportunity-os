# ADR-022: build every image and smoke /readyz on ephemeral stack after merge to main.
name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  COMPOSE_PROJECT: oos-ci
  DOCKER_BUILDKIT: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: make setup
      - run: make ci-images
      - run: make up
      - run: make ci-smoke-readyz
      - if: always()
        run: make down CLEAN=1