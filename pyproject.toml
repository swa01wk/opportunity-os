# uv workspace root (ADR-019). Exact versions live in uv.lock.
[project]
name = "opportunityos-workspace"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = [
    "opportunityos[worker]",
    "opportunityos-agent",
    "opportunityos-audio",
    "opportunityos-contracts",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pyyaml>=6.0,<7",
    "ruff>=0.14,<1",
    "testcontainers[postgres]>=4.9,<5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "agent", "media/audio", "contracts/python"]

[tool.uv.sources]
opportunityos = { workspace = true }
opportunityos-agent = { workspace = true }
opportunityos-audio = { workspace = true }
opportunityos-contracts = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["contracts/ts", "web", "media/scenes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "nfr_support",
    "opportunityos",
    "opportunityos_agent",
    "opportunityos_audio",
    "opportunityos_contracts",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"backend/tests/functional/support.py" = ["S608"]
"e2e/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
packages = ["opportunityos", "opportunityos_agent", "opportunityos_audio", "opportunityos_contracts"]
warn_unused_configs = true
check_untyped_defs = true

# ADR-019: strict on contracts and backend domain code.
[[tool.mypy.overrides]]
module = ["opportunityos_contracts.*", "opportunityos.domain.*"]
strict = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
pythonpath = ["e2e/nfr", "contracts/tests", "backend/migrations", "backend/tests/functional"]
testpaths = [
    "backend/tests",
    "agent/tests",
    "media/audio/tests",
    "contracts/tests",
    "e2e/nfr",
]
markers = [
    "t(id): T-xx catalogue ID (plans/TEST_STRATEGY.md)",
    "functional: needs Docker (Testcontainers); run via py-functional (SPEC-04)",
]
