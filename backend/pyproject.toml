[project]
name = "opportunityos"
version = "0.0.0"
description = "OpportunityOS backend: api and worker entry points (ADR-001)"
requires-python = "==3.13.*"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.120,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
# The worker imports the agent and media/audio packages (AGENTS.md repo map).
worker = ["opportunityos-agent", "opportunityos-audio"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opportunityos"
module-root = ""
