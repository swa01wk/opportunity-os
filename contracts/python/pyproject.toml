[project]
name = "opportunityos-contracts"
version = "0.0.0"
description = "Canonical Pydantic contract models (ADR-008)"
requires-python = "==3.13.*"
dependencies = [
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opportunityos_contracts"
module-root = ""
