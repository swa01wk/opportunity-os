# SPDX allowlist for uv.lock and pnpm-lock.yaml (SPEC-02 AC5, ADR-019).
# Expand only through a PR that updates this file and names the dependency in the PR body.
allowed:
  - Apache-2.0
  - Apache-2.0 AND MIT
  - Apache-2.0 OR BSD-2-Clause
  - BSD-2-Clause
  - BSD-3-Clause
  - CC0-1.0
  - ISC
  - LGPL-3.0-only
  - MIT
  - MIT AND PSF-2.0
  - MIT AND Python-2.0
  - MPL-2.0
  - PSF-2.0
  - Unlicense
  - 0BSD
  # Metadata gaps on some wheels: treat as unknown and fail unless mapped in overrides.
overrides:
  # PyPI classifiers and legacy short names (SPEC-02 B13).
  PSFL: PSF-2.0
  "Python Software Foundation License": PSF-2.0
  pathspec: MIT
  "3-Clause BSD License": BSD-3-Clause